<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Würfel-Experiment – Dateneingabe</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fa;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 16px; }
    main {
      width: min(100%, 680px);
      margin: 0 auto;
      background: #fff;
      border: 1px solid #e3e8f0;
      border-radius: 20px;
      padding: clamp(22px, 5vw, 38px);
      box-shadow: 0 12px 36px rgba(23, 32, 51, .07);
    }
    .eyebrow { margin: 0 0 8px; color: #52627a; font-size: .83rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.65rem, 4vw, 2.15rem); letter-spacing: -.035em; }
    .intro { margin: 10px 0 26px; color: #52627a; line-height: 1.55; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: grid; gap: 7px; }
    label { font-size: .95rem; font-weight: 650; }
    input {
      width: 100%; border: 1px solid #cbd4e1; border-radius: 11px;
      padding: 13px 14px; color: #172033; background: #fff; font: inherit; font-size: 1.05rem;
    }
    input:focus { outline: 3px solid rgba(47, 111, 235, .17); border-color: #2f6feb; }
    .summary {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin: 22px 0; padding: 15px 17px; border-radius: 12px; background: #f1f5fb;
    }
    .summary span:first-child { color: #52627a; font-weight: 600; }
    #total { font-size: 1.4rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    button {
      width: 100%; border: 0; border-radius: 12px; padding: 14px 18px;
      background: #245edb; color: white; font: inherit; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: background .15s ease, transform .15s ease;
    }
    button:hover:not(:disabled) { background: #194dbb; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: .6; }
    #status { min-height: 1.5em; margin: 14px 0 0; font-size: .94rem; line-height: 1.45; }
    #status.success { color: #087443; }
    #status.error { color: #b42318; }
    .footnote { margin: 20px 0 0; color: #68778d; font-size: .82rem; line-height: 1.5; }
    @media (max-width: 480px) {
      body { padding: 14px 10px; }
      main { border-radius: 15px; }
      .fields { grid-template-columns: 1fr; gap: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Datenerfassung · Mathematik</p>
    <h1>Würfel-Experiment</h1>
    <p class="intro">Trage ein, wie oft jede Augenzahl gewürfelt wurde. Alle sechs Felder müssen ausgefüllt werden. Eine 0 ist ein gültiger Wert.</p>

    <form id="experiment-form">
      <div class="fields">
        <div class="field"><label for="anzahl_1">Wie oft kam die 1?</label><input id="anzahl_1" name="anzahl_1" type="number" min="0" max="100000" step="1" inputmode="numeric" placeholder="z. B. 8" required></div>
        <div class="field"><label for="anzahl_2">Wie oft kam die 2?</label><input id="anzahl_2" name="anzahl_2" type="number" min="0" max="100000" step="1" inputmode="numeric" placeholder="z. B. 12" required></div>
        <div class="field"><label for="anzahl_3">Wie oft kam die 3?</label><input id="anzahl_3" name="anzahl_3" type="number" min="0" max="100000" step="1" inputmode="numeric" placeholder="z. B. 9" required></div>
        <div class="field"><label for="anzahl_4">Wie oft kam die 4?</label><input id="anzahl_4" name="anzahl_4" type="number" min="0" max="100000" step="1" inputmode="numeric" placeholder="z. B. 11" required></div>
        <div class="field"><label for="anzahl_5">Wie oft kam die 5?</label><input id="anzahl_5" name="anzahl_5" type="number" min="0" max="100000" step="1" inputmode="numeric" placeholder="z. B. 10" required></div>
        <div class="field"><label for="anzahl_6">Wie oft kam die 6?</label><input id="anzahl_6" name="anzahl_6" type="number" min="0" max="100000" step="1" inputmode="numeric" placeholder="z. B. 10" required></div>
      </div>

      <div class="summary" aria-live="polite">
        <span>Gesamtzahl der Würfe</span>
        <strong id="total">0</strong>
      </div>

      <button id="submit-button" type="submit">Messreihe absenden</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="footnote">Es werden nur die sechs Häufigkeiten übertragen. Namen oder E-Mail-Adressen werden nicht abgefragt.</p>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // TODO: Diese beiden Werte durch die Angaben aus deinem Supabase-Projekt ersetzen.
    const SUPABASE_URL = 'https://nzujsgiwllnbqameygxz.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Cep0GIwZnrJLNshnZzMwdA_lNtErFte';

    const form = document.querySelector('#experiment-form');
    const totalElement = document.querySelector('#total');
    const statusElement = document.querySelector('#status');
    const submitButton = document.querySelector('#submit-button');
    const fieldNames = ['anzahl_1', 'anzahl_2', 'anzahl_3', 'anzahl_4', 'anzahl_5', 'anzahl_6'];

    let supabase = null;
    const configurationIsPresent =
      !SUPABASE_URL.includes('DEIN-PROJEKT') &&
      !SUPABASE_PUBLISHABLE_KEY.includes('DEIN_PUBLIC_KEY');

    if (configurationIsPresent) {
      supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
      });
    }

    function readValues() {
      const values = {};
      for (const name of fieldNames) {
        const input = document.getElementById(name);
        const raw = input.value.trim();
        if (raw === '') throw new Error(`Bitte fülle das Feld „${input.labels[0].textContent}“ aus.`);
        const value = Number(raw);
        if (!Number.isSafeInteger(value) || value < 0 || value > 100000) {
          throw new Error('Bitte gib in jedem Feld eine ganze Zahl zwischen 0 und 100.000 ein.');
        }
        values[name] = value;
      }
      const total = Object.values(values).reduce((sum, value) => sum + value, 0);
      if (total === 0) throw new Error('Die Gesamtzahl der Würfe muss mindestens 1 betragen.');
      return { values, total };
    }

    function updateTotal() {
      const sum = fieldNames.reduce((total, name) => {
        const value = Number(document.getElementById(name).value);
        return total + (Number.isSafeInteger(value) && value > 0 ? value : 0);
      }, 0);
      totalElement.textContent = sum.toLocaleString('de-DE');
    }

    function showStatus(message, kind = '') {
      statusElement.textContent = message;
      statusElement.className = kind;
    }

    for (const name of fieldNames) {
      document.getElementById(name).addEventListener('input', updateTotal);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      showStatus('');

      let values;
      try {
        ({ values } = readValues());
      } catch (error) {
        showStatus(error.message, 'error');
        return;
      }

      if (!supabase) {
        showStatus('Bitte trage zuerst die Supabase-Projekt-URL und den Publishable Key im Code ein.', 'error');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Wird übertragen …';

      try {
        const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          const { error: signInError } = await supabase.auth.signInAnonymously();
          if (signInError) throw signInError;
        }

        const { error: insertError } = await supabase
          .from('wuerfel_messreihen')
          .insert(values);

        if (insertError) throw insertError;

        form.reset();
        updateTotal();
        showStatus('Vielen Dank! Deine Messreihe wurde erfolgreich gespeichert.', 'success');
      } catch (error) {
        console.error('Übertragungsfehler:', error);
        showStatus(`Die Übertragung ist fehlgeschlagen: ${error.message || 'Unbekannter Fehler'}`, 'error');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Messreihe absenden';
      }
    });
  </script>
</body>
</html>
